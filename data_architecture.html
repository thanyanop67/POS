<script>
function downloadSVG() {
  const svg = document.getElementById('diagram');
  const s = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([s], { type: 'image/svg+xml;charset=utf-8' });
  trigger(URL.createObjectURL(blob), 'data-architecture-pos.svg');
}

function downloadPNG() {
  const svg = document.getElementById('diagram');
  const s = new XMLSerializer().serializeToString(svg);
  const img = new Image();
  const url = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(s)));
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = 1400; c.height = 726;
    const ctx = c.getContext('2d');
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, 1400, 726);
    ctx.drawImage(img, 0, 0);
    trigger(c.toDataURL('image/png'), 'data-architecture-pos.png');
  };
  img.src = url;
}

function trigger(href, name) {
  const a = document.createElement('a');
  a.href = href; a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>
