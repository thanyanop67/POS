<script>
function dlSVG(){
  const s=new XMLSerializer().serializeToString(document.getElementById('d'));
  go(URL.createObjectURL(new Blob([s],{type:'image/svg+xml'})),'data-architecture-pos-layers.svg');
}
function dlPNG(){
  const s=new XMLSerializer().serializeToString(document.getElementById('d'));
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas'); c.width=1200; c.height=810;
    const ctx=c.getContext('2d');
    ctx.fillStyle='white'; ctx.fillRect(0,0,1200,810);
    ctx.drawImage(img,0,0);
    go(c.toDataURL('image/png'),'data-architecture-pos-layers.png');
  };
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(s)));
}
function go(h,n){
  const a=document.createElement('a'); a.href=h; a.download=n;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
</script>
